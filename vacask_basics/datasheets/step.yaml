# time[argmin(...)] chooses the saved sample nearest the 63.2 percent level.
description: VACASK step response and vector-based scalar measures for three RC filters.
parameters:
  resistance:
  - 1000
  capacitance: logspace(-7, -6, 3)
tests:
  step:
    source: netlist
    engine: vacask
    measure:
      vc_final_voltage: last(vout)
      vc_time_63: time[argmin(abs(vout - 0.6321205588))]
    vc_final_voltage:
      min: 0.999
      max: 1.001
      unit: V
    vc_time_63:
      min: 9.0e-05
      max: 0.00101
      unit: s
    transient_signals:
    - vin
    - vout
transient_equations:
  vc_resistor_drop: vin - vout
reports:
  formats:
  - png
  - svg
  pdf: true
  markdown: true
  plots:
  - type: transient
    name: vacask_step_by_capacitance
    signals:
    - vout
    - vc_resistor_drop
    group: capacitance
    runs: all_valid
